name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Saver Version
      description: Shown on your Worker's /_saver/ page and in Control Panel > Saving > Cloudflare Saver.
      placeholder: e.g., 2.0.0
    validations:
      required: true

  - type: input
    id: tiddlywiki-version
    attributes:
      label: TiddlyWiki Version
      description: Which version of TiddlyWiki are you using?
      placeholder: e.g., 5.3.8
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other (specify in Additional Context)
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Wiki Access
      description: How is the wiki set to be viewed (READ_ACCESS)?
      options:
        - Public
        - Private
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console Logs/Error Messages
      description: |
        Paste any error messages. Turn on "Log details to the browser console" in the plugin settings,
        then open the browser DevTools (F12) and look at the Console tab.
        Worker errors appear in the Cloudflare dashboard under your Worker > Logs.
        Remove passwords and tokens before posting.
      render: shell
      placeholder: Paste error messages here

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, related issues, etc.)
      placeholder: Any other relevant information
