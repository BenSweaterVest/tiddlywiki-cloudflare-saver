name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - run: npm run lint
      - run: npm run check:build
      - run: npm test
      - run: npm run build

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cloudflare-saver-plugin.json
            dist/cloudflare-saver-plugin.tid
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Upgrading

            Redeploy your Worker from this release (pull the changes into your Worker repository, or run `npx wrangler deploy` in `worker/`). Then open your wiki, go to Control Panel > Saving > Cloudflare Saver, and click **Update and reload** when it offers the new plugin version.

            The plugin files below are only needed for manual installs. Full instructions are in the [README](https://github.com/BenSweaterVest/tiddlywiki-cloudflare-saver#readme).
